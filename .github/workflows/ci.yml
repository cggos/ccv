name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'site/**'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - build_type: Release
            with_opencv: ON
            build_test: ON
          - build_type: Debug
            with_opencv: ON
            build_test: ON
          # The current unit tests use OpenCV directly, so the OpenCV-disabled
          # CCV sources are validated without building those tests.
          - build_type: Release
            with_opencv: OFF
            build_test: OFF

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            libgtest-dev \
            libeigen3-dev \
            clang-format \
            libopencv-dev \
            libopencv-contrib-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TEST=${{ matrix.build_test }} \
            -DWITH_OPENCV=${{ matrix.with_opencv }} \
            -DWITH_PCL=OFF \
            -DWITH_GL=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        if: matrix.build_test == 'ON'
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Configure OpenCV examples
        if: matrix.with_opencv == 'ON'
        run: cmake -S libs/opencv -B build/opencv-examples

      - name: Build chamfer matching example
        if: matrix.with_opencv == 'ON'
        run: cmake --build build/opencv-examples --target chamfer_matching --parallel $(nproc)

      - name: Check Format
        if: matrix.build_type == 'Release' && matrix.with_opencv == 'ON'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- \
            '*.cpp' '*.cc' '*.h' '*.hpp')
          if (( ${#files[@]} )); then
            clang-format --dry-run --Werror "${files[@]}"
          fi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake eigen googletest opencv

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON \
            -DWITH_OPENCV=ON \
            -DWITH_PCL=OFF \
            -DWITH_GL=OFF

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Test
        run: |
          cd build
          ctest --output-on-failure

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check Python format
        run: |
          cd python
          ruff check .
          ruff format --check .

      - name: Install package
        run: |
          cd python
          pip install .

      - name: Test import
        run: |
          python -c "import libccv; print('libccv imported successfully')"
